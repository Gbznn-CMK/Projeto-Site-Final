<div class="app">

  <aside class="sidebar" [class.collapsed]="collapsed" [class.expanded-mobile]="mobileExpanded">
    <div class="sidebar-head">
      <div class="logo-mark">
      <img src="/img/Logo-branca.png" alt="NaHora Serv" class="logo-img">
      </div>
      <span class="brand-name">NaHora Serv</span>
      <button
        class="collapse-btn"
        title="Recolher/expandir menu"
        (click)="toggleSidebar()">
        <img src="/img/seta-pequena-direita.png" alt="" aria-hidden="true">
      </button>
    </div>

    <div class="nav-group">
      <div class="nav-label">CLIENTE</div>
      <a class="nav-item active">
        <img class="nav-icon" src="/img/botao-home.png" alt="">
        <span class="label">Início</span>
      </a>
      <a class="nav-item">
        <img class="nav-icon" src="/img/buscar.png" alt="">
        <span class="label">Buscar</span>
      </a>
      <a class="nav-item">
        <img class="nav-icon" src="/img/dias-do-calendario.png" alt="">
        <span class="label">Agendamentos</span>
      </a>
      <a class="nav-item">
        <img class="nav-icon" src="/img/estrela-favotios.png" alt="">
        <span class="label">Favoritos</span>
      </a>
    </div>

    <div class="nav-group">
      <div class="nav-label">SUPORTE</div>
      <a class="nav-item">
        <img class="nav-icon" src="/img/SAC.png" alt="">
        <span class="label">SAC</span>
      </a>
      <a class="nav-item">
        <img class="nav-icon" src="/img/configuracoes.png" alt="">
        <span class="label">Configurações</span>
      </a>
    </div>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-profile">
      <div class="profile-row">
        <div class="avatar">N</div>
        <div class="profile-info">
          <strong>Nome</strong>
          <small>Cliente</small>
        </div>
        <button
          class="profile-menu-btn"
          title="Configurações do perfil"
          (click)="toggleProfileMenu()">
          <img src="/img/menu-pontos-vertical.png" alt="">
        </button>
      </div>

      <button class="logout-btn-full" title="Sair" (click)="logout()">
        <img src="/img/saida.png" alt="" class="logout-icon">
        <span class="label">Sair</span>
      </button>
    </div>
  </aside>
