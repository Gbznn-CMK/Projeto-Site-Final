<!-- Cabeçalho do Perfil -->
<div class="profile-header">
  <div class="header-avatar">
    <svg class="avatar-icon" viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"
      />
    </svg>
  </div>
  <div class="header-welcome">
    <h2>Olá, Bem-vindo(a) {{ usuario.nome }}</h2>
    <h3>{{ usuario.sobrenome || ' Complete seu perfil' }}</h3>
  </div>

  <button class="btn-edit-profile" (click)="abrirModal()" title="Editar dados do perfil">
    ✏️ Editar Perfil
  </button>
</div>

<!-- Cartão de Informações -->
<div class="profile-card">
  <div class="form-grid">
    <div class="field-group">
      <span class="icon">👤</span>
      <span class="field-value">{{ usuario.nome }}</span>
    </div>

    <div class="field-group">
      <span class="field-value" [class.placeholder-text]="!usuario.sobrenome">
        {{ usuario.sobrenome || 'Adicionar sobrenome' }}
      </span>
    </div>

    <div class="field-group">
      <span class="icon">✉️</span>
      <span class="field-value">{{ usuario.email }}</span>
    </div>

    <div class="field-group">
      <span class="icon">📱</span>
      <span class="field-value">{{ usuario.telefone }}</span>
    </div>

    <div class="field-group full-width">
      <span class="icon">🪪</span>
      <span class="field-value" [class.placeholder-text]="!usuario.cpf">
        {{ usuario.cpf || 'Adicionar CPF' }}
      </span>
    </div>
  </div>
</div>

<!-- Modal / Popup -->
@if (modalAberta) {
  <div class="modal-overlay" (click)="fecharModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>Editar Informações</h3>
        <button class="close-btn" (click)="fecharModal()">&times;</button>
      </div>

      <form (ngSubmit)="salvarPerfil()">
        <div class="input-group">
          <label for="nome">Nome</label>
          <input id="nome" type="text" [(ngModel)]="dadosEdicao.nome" name="nome" required />
        </div>

        <div class="input-group">
          <label for="sobrenome">Sobrenome</label>
          <input
            id="sobrenome"
            type="text"
            [(ngModel)]="dadosEdicao.sobrenome"
            name="sobrenome"
            placeholder="Ex: Todynho"
          />
        </div>

        <div class="input-group">
          <label for="email">E-mail</label>
          <input id="email" type="email" [(ngModel)]="dadosEdicao.email" name="email" />
        </div>

        <div class="input-group">
          <label for="telefone">Telefone / Celular</label>
          <input
            id="telefone"
            type="text"
            [(ngModel)]="dadosEdicao.telefone"
            (input)="formatarTelefone($event)"
            name="telefone"
            placeholder="(21) 99999-9999"
          />
        </div>

        <div class="input-group">
          <label for="cpf">CPF</label>
          <input
            id="cpf"
            type="text"
            [(ngModel)]="dadosEdicao.cpf"
            (input)="formatarCPF($event)"
            name="cpf"
            placeholder="000.000.000-00"
          />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="fecharModal()">Cancelar</button>
          <button type="submit" class="btn-save">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>
}
